name: Supabase keep-alive

# Supabase free tier pauses a project after ~7 days with no activity.
# This pings the public REST endpoint daily so the project never goes idle.
# The anon/publishable key is safe to expose (RLS gates everything), so no
# repo secrets are needed. Does NOT un-pause an already-paused project; it
# prevents the idle timer from ever reaching the pause threshold.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the top of the hour)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public_recipes
        run: |
          set -euo pipefail
          URL="https://axajsafyosisflrjqpya.supabase.co/rest/v1/public_recipes?select=id&limit=1"
          KEY="sb_publishable_UvmbuCT6dSf-BT0__5QP8w_Btq6Wr3v"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase keep-alive ping failed (HTTP $code) — project may be paused."
            exit 1
          fi
